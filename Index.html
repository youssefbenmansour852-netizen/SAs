<title>S-A-U</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: Ankündigungsleiste, Kopfzeile mit Mega-Menü, Hero mit zwei Schwertern, Laufband, Kategorien, Aktion mit Countdown, Reihen für Neu und Angebote, Shop mit zwei Artikeln pro Zeile, Vorteile, Kontakt, Fußzeile */
  :root {
    --bg: #000000;
    --bg-2: #0b0b0b;
    --bg-3: #151515;
    --line: #2b2b2b;
    --fg: #ffffff;
    --muted: #a6a6a6;
    --tint: rgba(255, 255, 255, 0.05);
    --purple: #9a5cff;
    --purple-d: #6d28d9;
    --purple-deep: #240a47;
    --blue: #3d94ff;
    --blue-d: #1d62d8;
    --blue-deep: #0a2a66;
    --grad: linear-gradient(90deg, var(--purple-d), var(--blue-d));
    --display: "Big Shoulders Display", Impact, "Arial Narrow Bold", sans-serif;
    --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html.lock { overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: var(--gutter-l);
    padding-right: var(--gutter-r);
    padding-block: 0 0;
    overflow-x: clip;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 30;
  }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .bleed { margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .ico { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(38px, 7vw, 64px); line-height: 0.95; letter-spacing: 0.03em; text-transform: uppercase; text-wrap: balance; }
  .eyebrow { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  .btn {
    display: inline-block; padding: 14px 24px; background: var(--grad); color: var(--fg); text-decoration: none; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; border: 1px solid transparent; text-align: center;
  }
  .btn:hover { background: var(--bg); border-color: var(--blue); }
  .btn.ghost { background: transparent; border-color: var(--fg); }
  .btn.ghost:hover { background: var(--grad); border-color: transparent; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  .link:hover { color: var(--fg); border-bottom-color: var(--fg); }

  /* Ankündigungsleiste */
  .ann { position: relative; height: 38px; overflow: hidden; background: var(--grad); font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
  .ann-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 12px; opacity: 0; translate: 0 10px; transition: opacity 0.5s, translate 0.5s; }
  .ann-msg.on { opacity: 1; translate: 0 0; }

  /* Kopfzeile */
  header.bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .bar-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 8px; gap: 8px; }
  .bar-l { display: flex; justify-content: flex-start; }
  .bar-r { display: flex; justify-content: flex-end; gap: 2px; }
  .mark { font-family: var(--display); font-weight: 900; font-size: 34px; letter-spacing: 0.1em; text-decoration: none; line-height: 1; padding-left: 0.1em; }
  .icon-btn { background: transparent; border: 1px solid transparent; width: 44px; height: 44px; display: inline-grid; place-items: center; cursor: pointer; position: relative; }
  .icon-btn:hover { border-color: var(--fg); }
  .badge {
    position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 4px; background: var(--grad); color: var(--fg);
    font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums;
  }
  nav.links { display: none; }
  nav.links button {
    background: none; border: 0; padding: 10px 2px; cursor: pointer; color: var(--muted); font-size: 12.5px; letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 1px solid transparent; display: inline-flex; align-items: center; gap: 6px;
  }
  nav.links button:hover, nav.links button[aria-expanded="true"] { color: var(--fg); border-bottom-color: var(--fg); }
  nav.links .caret { width: 10px; height: 10px; stroke-width: 2; }
  nav.links button.hot { color: var(--fg); }
  nav.links button.hot span { background: var(--grad); padding: 2px 8px; }
  @media (min-width: 900px) {
    .bar-in { grid-template-columns: auto 1fr auto; gap: 24px; }
    .bar-l { display: none; }
    nav.links { display: flex; justify-content: center; gap: 28px; }
  }

  .mega { position: absolute; left: 0; right: 0; top: 100%; background: var(--bg); border-bottom: 1px solid var(--fg); padding: 28px var(--gutter-r) 32px var(--gutter-l); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); animation: dropdown 0.22s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes dropdown { from { translate: 0 -10px; opacity: 0; } to { translate: 0 0; opacity: 1; } }
  .mega-in { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1.3fr; gap: 32px; align-items: start; }
  .mega h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 56px; line-height: 0.9; letter-spacing: 0.05em; text-transform: uppercase; }
  .mega ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .mega .col-t { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .mega li button { background: none; border: 0; padding: 6px 0; cursor: pointer; font-size: 17px; text-align: left; border-bottom: 1px solid transparent; }
  .mega li button:hover { border-bottom-color: var(--fg); }
  .mega-feat { display: grid; grid-template-columns: 90px 1fr; gap: 16px; align-items: center; border: 1px solid var(--line); padding: 14px; background: var(--bg-2); }
  .mega-feat .tile { aspect-ratio: 1 / 1.2; }
  .mega-feat strong { display: block; font-size: 15px; }
  .mega-feat span { color: var(--muted); font-size: 13px; }

  /* Hero */
  .hero {
    padding-block: 40px 52px; overflow: hidden;
    background:
      radial-gradient(42% 60% at 8% 50%, rgba(109, 40, 217, 0.28), transparent 70%),
      radial-gradient(42% 60% at 92% 50%, rgba(29, 98, 216, 0.28), transparent 70%);
  }
  .hero-grid { --sw-h: clamp(240px, 52vw, 600px); position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: clamp(4px, 2vw, 32px); }
  .bw { position: relative; z-index: 3; transform: translate(calc(var(--mx, 0) * -14px), calc(var(--my, 0) * -10px)); transition: transform 0.3s ease-out; }
  .bw.l { rotate: calc(var(--sp, 0) * -16deg); }
  .bw.r { rotate: calc(var(--sp, 0) * 16deg); }
  .blade { height: var(--sw-h); aspect-ratio: 60 / 600; width: auto; display: block; overflow: visible; }
  .blade.l { --sc: var(--purple); --sf: var(--purple-deep); rotate: -7deg; filter: drop-shadow(0 0 16px rgba(154, 92, 255, 0.55)); }
  .blade.r { --sc: var(--blue); --sf: var(--blue-deep); rotate: 7deg; filter: drop-shadow(0 0 16px rgba(61, 148, 255, 0.55)); }
  .idle .bw.l { animation: floatY 7s ease-in-out infinite; }
  .idle .bw.r { animation: floatY 7s ease-in-out -3.5s infinite; }
  .idle .blade.l { animation: glowL 5s ease-in-out infinite; }
  .idle .blade.r { animation: glowR 5s ease-in-out -2.5s infinite; }
  @keyframes floatY { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }
  @keyframes glowL { 0%, 100% { filter: drop-shadow(0 0 14px rgba(154, 92, 255, 0.5)); } 50% { filter: drop-shadow(0 0 30px rgba(154, 92, 255, 0.9)); } }
  @keyframes glowR { 0%, 100% { filter: drop-shadow(0 0 14px rgba(61, 148, 255, 0.5)); } 50% { filter: drop-shadow(0 0 30px rgba(61, 148, 255, 0.9)); } }
  .clash {
    position: absolute; left: 50%; top: 50%; width: clamp(200px, 50vw, 620px); aspect-ratio: 1; translate: -50% -50%; scale: 0.2; opacity: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0, rgba(154, 92, 255, 0.5) 16%, rgba(61, 148, 255, 0.28) 36%, transparent 66%);
  }
  .ring { position: absolute; left: 50%; top: 50%; width: clamp(180px, 40vw, 480px); aspect-ratio: 1; margin: calc(clamp(180px, 40vw, 480px) / -2) 0 0 calc(clamp(180px, 40vw, 480px) / -2); border-radius: 50%; border: 2px solid var(--blue); opacity: 0; scale: 0.1; pointer-events: none; z-index: 2; }
  .ring.b { border-color: var(--purple); }
  .sparks { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 4; pointer-events: none; }
  .sparks i { position: absolute; left: 0; top: 0; width: 22px; height: 2px; margin-top: -1px; background: var(--fg); transform-origin: 0 50%; box-shadow: 0 0 8px var(--purple); }
  .sparks i:nth-child(3n) { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  .sparks i:nth-child(3n + 1) { background: var(--purple); box-shadow: 0 0 8px var(--purple); }
  .title-col { text-align: center; min-width: 0; position: relative; z-index: 1; }
  h1.big {
    margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(64px, 25vw, 400px); line-height: 0.86; letter-spacing: 0.02em; white-space: nowrap; cursor: pointer;
    text-shadow: -14px 0 60px rgba(154, 92, 255, 0.45), 14px 0 60px rgba(61, 148, 255, 0.4);
  }
  h1.big .ch { display: inline-block; }
  .tag { margin: 18px 0 0; color: var(--muted); font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }

  /* Laufband */
  .marquee { overflow: hidden; border-block: 1px solid var(--line); background: var(--bg-2); }
  .track { display: flex; align-items: center; width: max-content; animation: slide 36s linear infinite; }
  .track span { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; padding: 12px 18px; white-space: nowrap; }
  .track .o1 { color: transparent; -webkit-text-stroke: 1px var(--purple); }
  .track .o2 { color: transparent; -webkit-text-stroke: 1px var(--blue); }
  .msw { height: 12px; width: 120px; display: block; flex: none; }
  .msw.p { --sc: var(--purple); --sf: var(--purple-deep); }
  .msw.b { --sc: var(--blue); --sf: var(--blue-deep); }
  @keyframes slide { to { transform: translateX(-50%); } }

  section.block { padding-top: 72px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px; margin-bottom: 22px; }

  /* Kategorien */
  .cats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (min-width: 760px) { .cats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .cat-tile {
    position: relative; overflow: hidden; text-align: left; cursor: pointer; border: 1px solid var(--line); min-height: 130px; padding: 20px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
    background: radial-gradient(circle at 85% 30%, var(--glow), transparent 60%), var(--bg-2);
    transition: border-color 0.2s;
  }
  @media (min-width: 760px) { .cat-tile { min-height: 300px; } }
  .cat-tile.p { --sc: var(--purple); --sf: var(--purple-deep); --glow: rgba(109, 40, 217, 0.4); }
  .cat-tile.b { --sc: var(--blue); --sf: var(--blue-deep); --glow: rgba(29, 98, 216, 0.4); }
  .cat-tile.pb { --glow: rgba(109, 40, 217, 0.3); }
  .cat-tile:hover { border-color: var(--fg); }
  .cat-tile .art { position: absolute; right: 8%; top: -6%; height: 120%; width: auto; rotate: 28deg; transition: rotate 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); opacity: 0.95; filter: drop-shadow(0 0 14px var(--glow)); }
  .cat-tile .art.two { --sc: var(--blue); --sf: var(--blue-deep); right: 22%; rotate: -28deg; }
  .cat-tile:hover .art { rotate: 40deg; }
  .cat-tile:hover .art.two { rotate: -40deg; }
  .cat-tile b { position: relative; font-family: var(--display); font-weight: 900; font-size: clamp(44px, 9vw, 72px); line-height: 0.9; letter-spacing: 0.05em; text-transform: uppercase; }
  .cat-tile em { position: relative; font-style: normal; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }

  /* Aktion */
  .promo { margin-top: 72px; border-block: 1px solid var(--line); background: linear-gradient(115deg, #1b0839, #060f2b 70%); padding-block: 44px; }
  .promo-in { display: grid; gap: 30px; grid-template-columns: minmax(0, 1fr); align-items: center; }
  @media (min-width: 860px) { .promo-in { grid-template-columns: 1.1fr 1fr; } }
  .promo p { margin: 12px 0 0; color: #d4d4d4; max-width: 52ch; }
  .promo-r { display: grid; gap: 16px; }
  .cd { display: flex; gap: 10px; }
  .cd div { border: 1px solid var(--line); background: rgba(0, 0, 0, 0.5); min-width: 0; flex: 1 1 0; max-width: 92px; padding: 10px 4px; text-align: center; }
  .cd b { display: block; font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
  .cd small { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .code-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .code { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: 0.2em; border: 1px dashed var(--fg); padding: 6px 16px; user-select: all; }
  .code-hint { font-size: 12px; color: var(--muted); min-height: 1.2em; }

  /* Reihen */
  .scroller { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 14px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; margin-right: calc(-1 * var(--gutter-r)); padding-right: var(--gutter-r); }
  .scroller .card { flex: 0 0 min(58vw, 250px); scroll-snap-align: start; }

  /* Shop */
  .shop { max-width: 1000px; scroll-margin-top: 70px; }
  .count { color: var(--muted); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--fg); margin-bottom: 14px; }
  .tab { background: transparent; border: 0; border-right: 1px solid var(--fg); cursor: pointer; font-family: var(--display); font-weight: 800; font-size: clamp(18px, 4.4vw, 26px); letter-spacing: 0.12em; text-transform: uppercase; padding: 12px 4px; }
  .tab:last-child { border-right: 0; }
  .tab:hover { background: var(--bg-3); }
  .tab[aria-pressed="true"] { background: var(--grad); }
  .tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .tools { grid-template-columns: minmax(0, 1fr) auto; } }
  .search { position: relative; }
  .search .ico { position: absolute; left: 14px; top: 50%; translate: 0 -50%; pointer-events: none; color: var(--muted); }
  .search input { width: 100%; background: var(--bg-2); border: 1px solid var(--line); padding: 13px 14px 13px 46px; font-size: 15px; border-radius: 0; -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--fg); outline: none; }
  select.sort { background: var(--bg-2); border: 1px solid var(--line); padding: 13px 14px; font-size: 14px; border-radius: 0; cursor: pointer; min-width: 0; }
  select.sort:focus { border-color: var(--fg); outline: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .chip { background: transparent; color: var(--muted); border: 1px solid var(--line); cursor: pointer; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 14px; }
  .chip:hover { color: var(--fg); border-color: var(--fg); }
  .chip[aria-pressed="true"] { color: var(--fg); border-color: var(--purple); background: var(--bg-3); }
  .chip.sp[aria-pressed="true"] { border-color: var(--blue); }
  .chip-gap { width: 1px; background: var(--line); margin-inline: 4px; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 22px; max-width: 65ch; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 2.6vw, 28px); }
  .card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .tile {
    position: relative; aspect-ratio: 1 / 1.12; border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center;
    background: repeating-linear-gradient(135deg, var(--tint) 0 1px, transparent 1px 14px), radial-gradient(circle at 50% 40%, var(--tile-glow, var(--bg-3)), var(--bg-2) 72%);
    transition: border-color 0.2s;
  }
  .tile.p { --sc: var(--purple); --sf: var(--purple-deep); --ac: var(--purple); --tile-glow: rgba(109, 40, 217, 0.35); }
  .tile.b { --sc: var(--blue); --sf: var(--blue-deep); --ac: var(--blue); --tile-glow: rgba(29, 98, 216, 0.35); }
  .card:hover .tile { border-color: var(--ac, var(--fg)); }
  .tile .open { position: absolute; inset: 0; background: none; border: 0; cursor: pointer; display: grid; place-items: center; }
  .tile svg.art { height: 74%; width: auto; rotate: var(--r, 35deg); scale: var(--s, 1); transition: rotate 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); filter: drop-shadow(0 0 10px var(--tile-glow)); }
  .card:hover .tile svg.art { rotate: calc(var(--r, 35deg) + 9deg); }
  .tile .meta { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 60px); z-index: 1; pointer-events: none; }
  .tag-s { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; padding: 3px 7px; border: 1px solid var(--line); color: var(--muted); background: var(--bg); }
  .tag-s.new { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
  .tag-s.sale { background: var(--grad); color: var(--fg); border-color: transparent; font-weight: 600; }
  .fav { position: absolute; right: 4px; top: 4px; width: 42px; height: 42px; background: transparent; border: 0; cursor: pointer; display: grid; place-items: center; z-index: 2; }
  .fav .ico { width: 20px; height: 20px; }
  .fav[aria-pressed="true"] .ico { fill: var(--ac, var(--fg)); stroke: var(--ac, var(--fg)); }
  .card h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .card h3 button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: inherit; font-size: inherit; line-height: inherit; }
  .card h3 button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .card .kind { margin: -6px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .pr { display: flex; gap: 10px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .price { font-size: 17px; font-weight: 500; }
  .was { font-size: 14px; colo
